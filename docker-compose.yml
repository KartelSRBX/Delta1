name: delta1

x-app: &app
  build: .
  image: delta1-app:latest
  restart: unless-stopped
  environment: &app-env
    KAFKA_BOOTSTRAP: kafka:9092
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_USER: ${CLICKHOUSE_USER:-delta1}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-delta1}

services:
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: delta1
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-delta1}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-delta1}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/config.d/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 30

  generator:
    <<: *app
    command: ["delta1-generator"]
    environment:
      <<: *app-env
      EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-200}
      PLAYERS_PER_BRAND: ${PLAYERS_PER_BRAND:-2000}
      METRICS_PORT: 8000
    depends_on:
      kafka: { condition: service_healthy }

  processor:
    <<: *app
    command: ["delta1-processor"]
    environment:
      <<: *app-env
      BATCH_SIZE: ${BATCH_SIZE:-5000}
      FLUSH_INTERVAL_S: ${FLUSH_INTERVAL_S:-2}
      METRICS_PORT: 8001
    depends_on:
      kafka: { condition: service_healthy }
      clickhouse: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource 4.4.0
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/business.json
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-delta1}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-delta1}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - clickhouse
      - prometheus

volumes:
  clickhouse-data:
