[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "delta1"
version = "0.1.0"
description = "Real-time analytics pipeline for an iGaming platform: Kafka -> Python stream processor -> ClickHouse -> Grafana"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7,<3",
    "confluent-kafka>=2.5,<3",
    "clickhouse-connect>=0.8,<2",
    "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
partners = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "pyftpdlib>=1.5,<3"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "delta1[partners]"]

[project.scripts]
delta1-generator = "delta1.generator.main:main"
delta1-processor = "delta1.processor.main:main"
delta1-partners = "delta1.partners.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/delta1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["delta1", "delta1_common", "delta1_reports"]
