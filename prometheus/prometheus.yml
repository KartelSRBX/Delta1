global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: generator
    static_configs:
      - targets: ["generator:8000"]
  - job_name: processor
    static_configs:
      - targets: ["processor:8001"]
  - job_name: clickhouse
    static_configs:
      - targets: ["clickhouse:9363"]
